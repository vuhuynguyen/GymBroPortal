name: CD

# Builds the Angular SPA and deploys the build output (plus the /api proxy Function under functions/) to
# Cloudflare Pages with wrangler. Project name, output dir and the API origin live in wrangler.toml.
#
# Required repo secrets:  CLOUDFLARE_API_TOKEN (permission "Cloudflare Pages: Edit"), CLOUDFLARE_ACCOUNT_ID.
#
# The Dockerfile/nginx image is no longer built here — it remains for the compose / self-host path only.
on:
  push:
    branches: [main, master]
    tags: ['v*']

# One deploy at a time — never let two pushes race.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: run the full CI suite (build + tests) before anything ships. CD never deploys a red commit.
  # CI declares `workflow_call`, so this reuses it — no duplicated steps.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build (production)
        run: npm run build -- --configuration production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --branch=main --commit-dirty=true
